services:
  postgres:
    image: postgres:16
    container_name: grocery-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grocery}
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grocery} -d ${POSTGRES_DB:-grocery}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
